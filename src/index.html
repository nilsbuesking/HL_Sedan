<title>Wörth 1870</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15191e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a lithographed field map fills the screen; a dark ink command strip sits above and below it (beside it in landscape). */
:root {
  color-scheme: dark;
  --ink: #15191e;
  --ink-2: #1f252c;
  --ink-3: #323a44;
  --scrim: rgba(17, 20, 25, 0.93);
  --chalk: #ece6d6;
  --chalk-2: #aea897;
  --brass: #c9a35a;
  --brass-ink: #1e1608;
  --prussian: #2b3d5b;
  --bavaria: #6a92c2;
  --garance: #a7372b;
  --tricolour-blue: #27408b;
  --flag-black: #101010;
  --flag-white: #f3f0e6;
  --flag-red: #c4372d;
  --good: #92b479;
  --bad: #e06a52;
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-ui: "IBM Plex Sans Condensed", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --r: 10px;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--chalk);
  font: 15px/1.4 var(--f-ui); overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

#app {
  height: 100%; display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "bar" "stage" "sheet";
}

/* ---------- command strip: top */
#bar {
  grid-area: bar; display: flex; align-items: center; gap: 12px; min-height: 54px;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ink); border-bottom: 1px solid var(--ink-3);
}
.turn { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.turn-n { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-2); white-space: nowrap; }
.turn-n b { color: var(--chalk); font-size: 15px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.clock { font: italic 600 24px/1 var(--f-display); font-variant-numeric: lining-nums tabular-nums; letter-spacing: .01em; }
.side {
  margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px;
  border-radius: 16px; background: var(--ink-2); border: 1px solid var(--ink-3); font-weight: 600; font-size: 14px; white-space: nowrap;
}
.side small { font-weight: 500; color: var(--chalk-2); font-size: 12px; }
.flag { width: 20px; height: 14px; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.flag.de { background: linear-gradient(var(--flag-black) 0 33.4%, var(--flag-white) 0 66.7%, var(--flag-red) 0); }
.flag.fr { background: linear-gradient(90deg, var(--tricolour-blue) 0 33.4%, var(--flag-white) 0 66.7%, var(--flag-red) 0); }
.icon-btn {
  width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 12px;
  background: transparent; border: 1px solid transparent; color: var(--chalk);
}
.icon-btn:active { background: var(--ink-2); }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

/* ---------- map */
#stage { grid-area: stage; position: relative; overflow: hidden; background: var(--ink); margin-left: env(safe-area-inset-left, 0px); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#toast {
  position: absolute; top: 10px; left: 50%; transform: translate(-50%, -8px); max-width: calc(100% - 32px);
  background: var(--scrim); color: var(--chalk); border: 1px solid var(--ink-3); border-radius: 12px;
  padding: 8px 14px; font-size: 14px; line-height: 1.3; text-align: center; pointer-events: none;
  opacity: 0; transition: opacity .2s, transform .2s;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#mapCtl { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
#mapCtl button {
  width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center;
  background: var(--scrim); border: 1px solid var(--ink-3); color: var(--chalk);
}
#mapCtl svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- command strip: bottom sheet */
#sheet {
  grid-area: sheet; display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ink); border-top: 1px solid var(--ink-3);
}
#card { min-height: 116px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#actions { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 8px; }
.btn {
  min-height: 46px; border-radius: var(--r); background: var(--ink-2); border: 1px solid var(--ink-3);
  font-weight: 600; font-size: 15px; letter-spacing: .01em; padding: 0 10px; white-space: nowrap;
}
.btn:active { filter: brightness(1.2); }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
.btn.warn { background: var(--garance); color: var(--flag-white); border-color: transparent; }
.btn:disabled { opacity: .38; }
.btn.wide { grid-column: span 2; }

.ucard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.mini { width: 46px; height: 36px; flex: none; }
.u-name { font-weight: 600; font-size: 16px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.u-sub { color: var(--chalk-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.u-str { text-align: right; font-variant-numeric: tabular-nums; }
.u-str b { font: italic 700 26px/1 var(--f-display); font-variant-numeric: lining-nums tabular-nums; }
.u-str small { color: var(--chalk-2); font-size: 12px; display: block; letter-spacing: .08em; text-transform: uppercase; }
.meter { display: flex; gap: 2px; margin-top: 5px; }
.meter i { width: 12px; height: 4px; border-radius: 1px; background: var(--ink-3); }
.meter i.on { background: var(--chalk); }
.meter.low i.on { background: var(--bad); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--chalk); font-variant-numeric: tabular-nums; }
.facts em { font-style: normal; color: var(--chalk-2); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; margin-right: 4px; }
.where { font-size: 13px; color: var(--chalk-2); }
.where b { color: var(--chalk); font-weight: 500; }
.tag { display: inline-block; vertical-align: 2px; margin-left: 6px; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; background: var(--ink-3); color: var(--chalk); }
.tag.ready { background: var(--brass); color: var(--brass-ink); }
.tag.enemy { background: var(--garance); color: var(--flag-white); }
.tag.enemy.de { background: var(--prussian); }

.fc-head { font-size: 14px; color: var(--chalk-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc-head b { color: var(--chalk); font-weight: 600; }
.fc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fc-col { background: var(--ink-2); border-radius: var(--r); padding: 8px 12px; display: flex; flex-direction: column; }
.fc-col .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-2); }
.fc-col .big { font: italic 700 28px/1.05 var(--f-display); font-variant-numeric: lining-nums; }
.fc-col .big.good { color: var(--good); }
.fc-col .big.bad { color: var(--bad); }
.fc-col .rng { font-size: 12px; color: var(--chalk-2); }
.mods { font-size: 12px; color: var(--chalk-2); line-height: 1.35; }

.idle-h { font-size: 16px; font-weight: 600; }
.idle-h small { color: var(--chalk-2); font-weight: 400; font-size: 14px; }
.objs { display: flex; flex-wrap: wrap; gap: 6px; }
.obj { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 13px; background: var(--ink-2); font-size: 13px; }
.obj i { width: 8px; height: 8px; border-radius: 50%; }
.obj i.de { background: var(--chalk); box-shadow: inset 0 0 0 2px var(--prussian); }
.obj i.fr { background: var(--garance); }
.obj b { font-variant-numeric: tabular-nums; color: var(--chalk-2); font-weight: 500; }
.hint { font-size: 13px; color: var(--chalk-2); }
.ai-h { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--brass); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

/* ---------- overlays */
#overlay {
  position: fixed; inset: 0; z-index: 30; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  padding-block: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-bottom, 0px) + 28px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: text; user-select: text;
}
.panel { max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
.display { margin: 0; font: italic 700 clamp(56px, 18vw, 92px)/.9 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.display.small { font-size: clamp(38px, 11vw, 60px); }
.date { margin: -6px 0 0; font: 500 15px/1.3 var(--f-ui); color: var(--chalk-2); letter-spacing: .04em; }
.panel p { margin: 0; max-width: 62ch; }
.panel .lede { font-size: 16px; line-height: 1.5; }
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.choice {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left;
  padding: 14px 16px; border-radius: 14px; background: var(--ink-2); border: 1px solid var(--ink-3);
}
.choice b { display: block; font-size: 17px; font-weight: 600; }
.choice small { display: block; font-size: 13px; color: var(--chalk-2); line-height: 1.35; margin-top: 2px; }
.choice .arrow { color: var(--brass); font-size: 22px; }
.choice:active { border-color: var(--brass); }
.swatch { width: 34px; height: 26px; border-radius: 4px; position: relative; }
.swatch.de { background: var(--prussian); box-shadow: inset 0 4px 0 var(--flag-black), inset 0 5px 0 var(--flag-white); }
.swatch.fr { background: var(--garance); box-shadow: inset 0 4px 0 var(--tricolour-blue); }
.swatch.hs { background: linear-gradient(135deg, var(--prussian) 50%, var(--garance) 50%); }
.linkbtn { background: none; border: 0; padding: 8px 0; color: var(--brass); font-weight: 600; text-align: left; font-size: 15px; }
.rules { border-top: 1px solid var(--ink-3); padding-top: 12px; }
.rules summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; min-height: 32px; align-items: center; }
.rules summary::-webkit-details-marker { display: none; }
.rules summary::after { content: "+"; color: var(--brass); font-size: 20px; }
.rules[open] summary::after { content: "–"; }
.rules ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; color: var(--chalk); }
.rules li::marker { color: var(--brass); }
.rules h3 { margin: 14px 0 4px; font: italic 600 18px/1.2 var(--f-display); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--ink-3); }
.tbl th { color: var(--chalk-2); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.tblwrap { overflow-x: auto; }
.fine { font-size: 12px; color: var(--chalk-2); line-height: 1.45; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-list .btn { text-align: left; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; }
.menu-list .btn span { color: var(--chalk-2); font-weight: 400; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.log li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
.log time { color: var(--chalk-2); font-variant-numeric: tabular-nums; }
.log li.de span { border-left: 3px solid var(--bavaria); padding-left: 8px; }
.log li.fr span { border-left: 3px solid var(--garance); padding-left: 8px; }
.log li.capture span, .log li.end span { color: var(--brass); }
.tally { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tally div { background: var(--ink-2); border-radius: var(--r); padding: 10px 12px; }
.tally b { display: block; font: italic 700 30px/1.1 var(--f-display); font-variant-numeric: lining-nums; }
.tally small { color: var(--chalk-2); font-size: 12px; }
.verdict-de { color: var(--bavaria); }
.verdict-fr { color: var(--bad); }

/* ---------- landscape: map left, command column right */
@media (orientation: landscape) and (max-height: 560px) {
  #app { grid-template-columns: minmax(0, 1fr) clamp(250px, 34%, 330px); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "stage bar" "stage sheet"; }
  #bar { border-bottom: 1px solid var(--ink-3); border-left: 1px solid var(--ink-3); flex-wrap: wrap; padding-left: 14px; }
  #sheet { border-top: 0; border-left: 1px solid var(--ink-3); overflow-y: auto; justify-content: space-between; padding-left: 14px; }
  #stage { margin-left: env(safe-area-inset-left, 0px); }
  .clock { font-size: 20px; }
  #actions { grid-template-columns: 1fr 1fr; }
  #actions .btn.primary { grid-column: span 2; }
}
@media (prefers-reduced-motion: reduce) {
  .dots i { animation: none; opacity: .8; }
  #toast { transition: none; }
}
</style>

<div id="app">
  <header id="bar">
    <div class="turn">
      <span class="turn-n">Turn <b id="turnNo">1</b>/<span id="turnMax">14</span></span>
      <span class="clock" id="clock">08:00</span>
    </div>
    <div class="side" id="sidePill"><span class="flag de" id="sideFlag"></span><span id="sideName">Germans</span><small id="sideWho"></small></div>
    <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <main id="stage">
    <canvas id="map" aria-label="Battle map of Wörth. Tap a hex to select it."></canvas>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="mapCtl">
      <button id="fitBtn" aria-label="Show whole battlefield"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="focusBtn" aria-label="Centre on selection"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
  </main>
  <section id="sheet">
    <div id="card"></div>
    <div id="actions"></div>
  </section>
</div>
<div id="overlay" hidden></div>
